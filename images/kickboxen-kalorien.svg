<svg viewBox="0 0 900 246" width="100%" role="img" xmlns="http://www.w3.org/2000/svg"
     aria-label="Kalorienverbrauch pro Stunde bei 70 Kilogramm Körpergewicht. Kickboxen moderat rund 550 Kilokalorien, Joggen bei zehn Kilometern pro Stunde rund 620, Kickboxen intensiv 700 bis 900. Bei moderater Intensität liegen beide etwa gleichauf.">
  <text x="174" y="26" fill="#7080B0" font-family="Outfit, sans-serif" font-size="12" text-anchor="end">kcal pro Stunde</text>
  <text x="198" y="26" fill="#7080B0" font-family="Outfit, sans-serif" font-size="12">Beispiel: 70 kg Körpergewicht</text>
  <line x1="190" y1="42" x2="190" y2="204" stroke="#7080B0" stroke-width="1" opacity="0.16"/><text x="190" y="220" fill="#7080B0" font-family="Outfit, sans-serif" font-size="10.5" text-anchor="middle">0</text><line x1="340" y1="42" x2="340" y2="204" stroke="#7080B0" stroke-width="1" opacity="0.16"/><text x="340" y="220" fill="#7080B0" font-family="Outfit, sans-serif" font-size="10.5" text-anchor="middle">250</text><line x1="490" y1="42" x2="490" y2="204" stroke="#7080B0" stroke-width="1" opacity="0.16"/><text x="490" y="220" fill="#7080B0" font-family="Outfit, sans-serif" font-size="10.5" text-anchor="middle">500</text><line x1="640" y1="42" x2="640" y2="204" stroke="#7080B0" stroke-width="1" opacity="0.16"/><text x="640" y="220" fill="#7080B0" font-family="Outfit, sans-serif" font-size="10.5" text-anchor="middle">750</text><text x="174" y="71" fill="#D6DCEC" font-family="Outfit, sans-serif" font-size="13" text-anchor="end">Kickboxen moderat</text><rect x="190" y="54" width="330" height="26" rx="5" fill="#B87C1A" fill-opacity="1"/><text x="532" y="72" fill="#B87C1A" font-family="Syne, sans-serif" font-size="13" font-weight="700">ca. 550 kcal</text><text x="174" y="127" fill="#D6DCEC" font-family="Outfit, sans-serif" font-size="13" text-anchor="end">Joggen, 10 km/h</text><rect x="190" y="110" width="372" height="26" rx="5" fill="#7080B0" fill-opacity="1"/><text x="574" y="128" fill="#7080B0" font-family="Syne, sans-serif" font-size="13" font-weight="700">ca. 620 kcal</text><text x="174" y="183" fill="#D6DCEC" font-family="Outfit, sans-serif" font-size="13" text-anchor="end">Kickboxen intensiv</text><rect x="190" y="166" width="540" height="26" rx="5" fill="#D4A040" fill-opacity="0.35"/><rect x="190" y="166" width="420" height="26" rx="5" fill="#D4A040"/><text x="742" y="184" fill="#D4A040" font-family="Syne, sans-serif" font-size="13" font-weight="700">700 – 900 kcal</text>
</svg>