<svg viewBox="0 0 900 268" width="100%" role="img" xmlns="http://www.w3.org/2000/svg"
     aria-label="Der Vier-Wochen-Plan im Überblick. Woche 1 übt nur die Standbein-Drehung, 50 Wiederholungen pro Tag und Seite. Woche 2 ergänzt die Hüftöffnung, 30 Wiederholungen. Woche 3 ergänzt den Unterschenkel als Peitsche, 20 Wiederholungen in Zeitlupe. Woche 4 fügt nur noch Geschwindigkeit hinzu, die Bewegung bleibt dieselbe. Je mehr Elemente dazukommen, desto weniger Wiederholungen.">
  <text x="40" y="24" fill="#7080B0" font-family="Outfit, sans-serif" font-size="12">Jede Woche kommt genau ein Element dazu &mdash; und die Wiederholungszahl sinkt.</text>
  <rect x="40" y="38" width="191" height="200" rx="12" fill="#141E48" fill-opacity="0.5" stroke="rgba(255,255,255,0.07)"/><text x="54" y="60" fill="#E8B84B" font-family="Syne, sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.4">WOCHE 1</text><text x="54" y="84" fill="#FFFFFF" font-family="Syne, sans-serif" font-size="15.5" font-weight="700">Das Standbein</text><text x="54" y="112" fill="#D4A040" font-family="Syne, sans-serif" font-size="26" font-weight="800">50</text><text x="54" y="130" fill="#7080B0" font-family="Outfit, sans-serif" font-size="10.5">pro Tag, pro Seite</text><rect x="54" y="152" width="163" height="15" rx="4" fill="#D4A040"/><text x="60" y="163" fill="#0C1228" font-family="Outfit, sans-serif" font-size="9.5" font-weight="600">Standbein-Drehung</text><rect x="245" y="38" width="191" height="200" rx="12" fill="#141E48" fill-opacity="0.5" stroke="rgba(255,255,255,0.07)"/><text x="259" y="60" fill="#E8B84B" font-family="Syne, sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.4">WOCHE 2</text><text x="259" y="84" fill="#FFFFFF" font-family="Syne, sans-serif" font-size="15.5" font-weight="700">Die Hüftöffnung</text><text x="259" y="112" fill="#D4A040" font-family="Syne, sans-serif" font-size="26" font-weight="800">30</text><text x="259" y="130" fill="#7080B0" font-family="Outfit, sans-serif" font-size="10.5">pro Seite, täglich</text><rect x="259" y="152" width="163" height="15" rx="4" fill="rgba(184,124,26,0.28)"/><text x="265" y="163" fill="#B0B8D0" font-family="Outfit, sans-serif" font-size="9.5" font-weight="400">Standbein-Drehung</text><rect x="259" y="173" width="163" height="15" rx="4" fill="#D4A040"/><text x="265" y="184" fill="#0C1228" font-family="Outfit, sans-serif" font-size="9.5" font-weight="600">Hüfte öffnet</text><rect x="450" y="38" width="191" height="200" rx="12" fill="#141E48" fill-opacity="0.5" stroke="rgba(255,255,255,0.07)"/><text x="464" y="60" fill="#E8B84B" font-family="Syne, sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.4">WOCHE 3</text><text x="464" y="84" fill="#FFFFFF" font-family="Syne, sans-serif" font-size="15.5" font-weight="700">Die Peitsche</text><text x="464" y="112" fill="#D4A040" font-family="Syne, sans-serif" font-size="26" font-weight="800">20</text><text x="464" y="130" fill="#7080B0" font-family="Outfit, sans-serif" font-size="10.5">pro Seite, Zeitlupe</text><rect x="464" y="152" width="163" height="15" rx="4" fill="rgba(184,124,26,0.28)"/><text x="470" y="163" fill="#B0B8D0" font-family="Outfit, sans-serif" font-size="9.5" font-weight="400">Standbein-Drehung</text><rect x="464" y="173" width="163" height="15" rx="4" fill="rgba(184,124,26,0.28)"/><text x="470" y="184" fill="#B0B8D0" font-family="Outfit, sans-serif" font-size="9.5" font-weight="400">Hüfte öffnet</text><rect x="464" y="194" width="163" height="15" rx="4" fill="#D4A040"/><text x="470" y="205" fill="#0C1228" font-family="Outfit, sans-serif" font-size="9.5" font-weight="600">Unterschenkel folgt</text><rect x="655" y="38" width="191" height="200" rx="12" fill="#141E48" fill-opacity="0.5" stroke="rgba(255,255,255,0.07)"/><text x="669" y="60" fill="#E8B84B" font-family="Syne, sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.4">WOCHE 4</text><text x="669" y="84" fill="#FFFFFF" font-family="Syne, sans-serif" font-size="15.5" font-weight="700">Tempo</text><text x="669" y="112" fill="#D4A040" font-family="Syne, sans-serif" font-size="26" font-weight="800">—</text><text x="669" y="130" fill="#7080B0" font-family="Outfit, sans-serif" font-size="10.5">gleiche Bewegung, schneller</text><rect x="669" y="152" width="163" height="15" rx="4" fill="rgba(184,124,26,0.28)"/><text x="675" y="163" fill="#B0B8D0" font-family="Outfit, sans-serif" font-size="9.5" font-weight="400">Standbein-Drehung</text><rect x="669" y="173" width="163" height="15" rx="4" fill="rgba(184,124,26,0.28)"/><text x="675" y="184" fill="#B0B8D0" font-family="Outfit, sans-serif" font-size="9.5" font-weight="400">Hüfte öffnet</text><rect x="669" y="194" width="163" height="15" rx="4" fill="rgba(184,124,26,0.28)"/><text x="675" y="205" fill="#B0B8D0" font-family="Outfit, sans-serif" font-size="9.5" font-weight="400">Unterschenkel folgt</text><rect x="669" y="215" width="163" height="15" rx="4" fill="#D4A040"/><text x="675" y="226" fill="#0C1228" font-family="Outfit, sans-serif" font-size="9.5" font-weight="600">Geschwindigkeit</text>
</svg>